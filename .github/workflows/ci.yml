name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # PyCBC is not installed here, so tests/test_pipeline.py is skipped automatically;
      # the array-level tests (HHT, cross-correlation, filtering) run.
      - run: pytest -q
